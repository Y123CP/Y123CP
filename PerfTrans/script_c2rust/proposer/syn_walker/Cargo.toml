[package]
name = "syn_walker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "syn_walker"
path = "src/main.rs"

[dependencies]
syn          = { version = "2", features = ["full", "extra-traits", "visit"] }
quote        = "1"
proc-macro2  = { version = "1", features = ["span-locations"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
walkdir      = "2"

[profile.release]
opt-level = 3
lto       = "thin"
