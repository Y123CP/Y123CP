[workspace]                 # standalone root: profile below applies to whole dep graph

[package]
name = "purebin_raw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "brotli_raw"
path = "src/main.rs"

[dependencies]
brlib = { path = "../../../0_raw", package = "brotli_raw" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
