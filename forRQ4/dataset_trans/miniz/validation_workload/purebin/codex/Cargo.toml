[workspace]                 # standalone root: profile below applies to whole dep graph

[package]
name = "purebin_codex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "miniz_codex"
path = "src/main.rs"

[dependencies]
mzlib = { path = "../../../codex_version/code", package = "miniz_raw" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
