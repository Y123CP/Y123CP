#       dataset_trans/run_validation.py dataset_trans/miniz/validation_workload/purebin/study.toml
# ============================================================================

[study]
project     = "miniz"
compare     = ["c", "raw", "codex", "stage_a", "freeform", "full"]
report_mode = "per_input"

[builds.c]
binary_path = "dataset_trans/miniz/validation_workload/purebin/bin/miniz_c"
[builds.raw]
binary_path = "dataset_trans/miniz/validation_workload/purebin/bin/miniz_raw"
[builds.stage_a]
binary_path = "dataset_trans/miniz/validation_workload/purebin/bin/miniz_stage_a"

[builds.codex]
binary_path = "dataset_trans/miniz/validation_workload/purebin/bin/miniz_codex"
[builds.freeform]
binary_path = "dataset_trans/miniz/validation_workload/purebin/bin/miniz_freeform"
[builds.full]                                  # full arm = 3_perf_opt (rule-guided)
binary_path = "dataset_trans/miniz/validation_workload/purebin/bin/miniz_full"

[measure]
warmup_runs  = 5
measure_runs = 30
required_cv  = 0.03
max_load     = 1.0
cv_retries   = 2
pin_cpu      = 16
order        = ["c", "raw", "codex", "stage_a", "freeform", "full"]

[gates]
equivalence = "stdout_sha256"

[[operations]]
name = "compress"                 # zlib one-shot (mz_compress2 / mz_compress)
args = ["compress", "$INPUT", "$ITERS"]
status = "ready"
  [[operations.inputs]]
  name = "silesia-xml"
  path = "dataset_trans/miniz/validation_workload/inputs/silesia-xml"
  iters = 5
  stdout_sha256 = "7ae0eaf242340de3078188f133eff7d8a48624c463ad63d67af70e29b68f116b"
  [[operations.inputs]]
  name = "silesia-dickens"
  path = "dataset_trans/miniz/validation_workload/inputs/silesia-dickens"
  iters = 2
  stdout_sha256 = "a26d85b33ff59990a0d14f929fb1243d5278338ed48bd3c681d9087060bca2c9"

[[operations]]
name = "uncompress"               # zlib one-shot decode
args = ["uncompress", "$INPUT", "$ITERS"]
status = "ready"
  [[operations.inputs]]
  name = "silesia-xml.z"
  path = "dataset_trans/miniz/validation_workload/inputs/silesia-xml.z"
  iters = 40
  stdout_sha256 = "faa39e00375f27bbdc865b0ee9cba94b8df7b644bfa6fbc975717f10adc104da"
