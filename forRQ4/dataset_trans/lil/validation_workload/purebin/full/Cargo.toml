[workspace]                 # standalone root: profile below applies to whole dep graph

[package]
name = "purebin_full"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lil_full"
path = "src/main.rs"

[dependencies]
lillib = { path = "../../../3_perf_opt/crate", package = "lil_cleaned" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
