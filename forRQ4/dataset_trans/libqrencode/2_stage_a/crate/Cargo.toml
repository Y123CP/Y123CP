[workspace]
members = [
]
[package]
name = "libqrencode_cleaned"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "libqrencode_cleaned"
path = "lib.rs"
crate-type = ["rlib"]
[dependencies]

[[bin]]
path = "src/qrenc.rs"
name = "qrenc"

# perf_opt fair-build profile — auto-injected by bench_pipeline.py.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = false
