#       dataset_trans/run_validation.py dataset_trans/libxml2/validation_workload/purebin/study.toml
# ============================================================================

[study]
project     = "libxml2"
compare     = ["c", "raw", "codex", "stage_a", "freeform", "full"]
report_mode = "per_input"

[builds.c]
binary_path = "dataset_trans/libxml2/validation_workload/purebin/bin/libxml2_c"
[builds.raw]
binary_path = "dataset_trans/libxml2/validation_workload/purebin/bin/libxml2_raw"
[builds.stage_a]
binary_path = "dataset_trans/libxml2/validation_workload/purebin/bin/libxml2_stage_a"

[builds.codex]
binary_path = "dataset_trans/libxml2/validation_workload/purebin/bin/libxml2_codex"
[builds.freeform]
binary_path = "dataset_trans/libxml2/validation_workload/purebin/bin/libxml2_freeform"
[builds.full]                                  # full arm = 3_perf_opt (rule-guided)
binary_path = "dataset_trans/libxml2/validation_workload/purebin/bin/libxml2_full"

[measure]
warmup_runs  = 5
measure_runs = 30
required_cv  = 0.03
max_load     = 1.0
cv_retries   = 2
pin_cpu      = 16
order        = ["c", "raw", "codex", "stage_a", "freeform", "full"]

[gates]
equivalence = "stdout_sha256"

