[[operations]]
# round-4 coverage op: variant entry points of already-exercised kernels.
# {xml,html}{Ctxt,}Read{Doc,Fd,File,IO,Memory}, deprecated xmlParse*/
# xmlSAXParse*/xmlRecover*, xmlReaderFor*/xmlReaderNew* + accessor battery,
# writer WriteFormat* (delegates to WriteVFormat*) + Doc/Tree/PushParser/
# Filename constructors, xpath node-set algebra + parser-context stack ops,
# valid DTD-table copy/dump, DOMWrap, xmlsave/HTMLtree sink variants,
# xmlThrDef* + __xml* global accessors, SAX2 getters, schemas/relaxng/
# schematron mem+doc ctxts, debug shell script, catalog globals, encoding/
# chvalid/unicode/list/hash/dict/module/uri/pattern leftovers.
# Network-touching APIs (nanohttp, xmlIOHTTP*) deliberately excluded.
# Determinism notes hard-won here: xmlDump*Table output order follows the
# time-seeded hash -- only lengths are folded; xmlFreeTextWriter(push-parser)
# frees the ctxt+doc; xmlXPathLeading/Trailing return ALIASES when the
# second set has <2 nodes; xmlMallocAtomicLoc pairs with xmlMemFree.
name = "api_variants"
args = ["api_variants", "$INPUT", "$ITERS"]
status = "coverage_only"
  [[operations.inputs]]
  name = "api_variants-in"
  path = "dataset_trans/libxml2/validation_workload/inputs/slashdot16.xml"
  iters = 1
  stdout_sha256 = "2089fcb9da55ff41a8b67dc20100c26af4311ee80ae7b978dd4a9e2c7343b858"
