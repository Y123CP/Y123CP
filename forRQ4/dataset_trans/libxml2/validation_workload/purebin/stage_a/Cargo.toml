[workspace]                 # standalone root: profile below applies to whole dep graph

[package]
name = "purebin_stage_a"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "libxml2_stage_a"
path = "src/main.rs"

[dependencies]
xmllib = { path = "../../../2_stage_a/crate", package = "libxml2_cleaned" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
