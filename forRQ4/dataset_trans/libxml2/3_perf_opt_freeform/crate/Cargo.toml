[workspace]
members = [
]
[package]
name = "libxml2_cleaned"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "libxml2_cleaned"
path = "lib.rs"
crate-type = ["rlib"]
[dependencies]
c2rust-bitfields = "0.22.1"

[[bin]]
path = "src/xmlcatalog.rs"
name = "xmlcatalog"

[[bin]]
path = "src/xmllint.rs"
name = "xmllint"

# perf_opt fair-build profile — auto-injected by bench_pipeline.py.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = false
