[workspace]
members = [
]
[package]
name = "libxml2_cleaned"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "libxml2_cleaned"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]
[dependencies]
c2rust-bitfields = "0.22.1"

[[bin]]
path = "src/xmlcatalog.rs"
name = "xmlcatalog"

[[bin]]
path = "src/xmllint.rs"
name = "xmllint"
