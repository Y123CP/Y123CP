#       dataset_trans/run_validation.py dataset_trans/lodepng/validation_workload/purebin/study.toml
# ============================================================================

[study]
project     = "lodepng"
compare     = ["c", "raw", "codex", "stage_a", "freeform", "full"]
report_mode = "per_input"

[builds.c]
binary_path = "dataset_trans/lodepng/validation_workload/purebin/bin/lodepng_c"
[builds.raw]
binary_path = "dataset_trans/lodepng/validation_workload/purebin/bin/lodepng_raw"
[builds.stage_a]
binary_path = "dataset_trans/lodepng/validation_workload/purebin/bin/lodepng_stage_a"

[builds.codex]
binary_path = "dataset_trans/lodepng/validation_workload/purebin/bin/lodepng_codex"
[builds.freeform]
binary_path = "dataset_trans/lodepng/validation_workload/purebin/bin/lodepng_freeform"
[builds.full]                                  # full arm = 3_perf_opt (rule-guided)
binary_path = "dataset_trans/lodepng/validation_workload/purebin/bin/lodepng_full"

[measure]
warmup_runs  = 5
measure_runs = 30
required_cv  = 0.03
max_load     = 1.0
cv_retries   = 2
pin_cpu      = 16
order        = ["c", "raw", "codex", "stage_a", "freeform", "full"]

[gates]
equivalence = "stdout_sha256"

[[operations]]
name = "decode32"                 # PNG -> RGBA32 (inflate + unfilter + convert)
args = ["decode32", "$INPUT", "$ITERS"]
status = "ready"
  [[operations.inputs]]
  name = "islands.png"
  path = "dataset_trans/lodepng/validation_workload/inputs/islands.png"
  iters = 20
  stdout_sha256 = "ef5c46cec91241b0dfb9d4f84af4385a7b0908b5236c507e8aa0431f6863ed62"
  [[operations.inputs]]
  name = "generator.png"
  path = "dataset_trans/lodepng/validation_workload/inputs/generator.png"
