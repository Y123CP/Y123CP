# ============================================================================
                                                                 
#
                                     
#   c / raw(0_raw) / cleaned(1_cleaned) / stage_a(2_stage_a) / perf_opt(3_perf_opt)
                                                        
                                                                      
#
                                                               
#   bash perf_run.sh script_c2rust/.venv/bin/python \
#       dataset_trans/run_validation.py \
#       dataset_trans/libopenaptx/validation_workload/purebin/study.toml
# ============================================================================

[study]
project     = "libopenaptx"
compare     = ["c", "raw", "codex", "stage_a", "freeform", "full"]
report_mode = "per_input"

[builds.c]
binary_path = "dataset_trans/libopenaptx/validation_workload/purebin/bin/libopenaptx_c"
[builds.raw]
binary_path = "dataset_trans/libopenaptx/validation_workload/purebin/bin/libopenaptx_raw"
[builds.stage_a]                                 # E1 + intra_ptr(struct&mut)+ deunsafe
binary_path = "dataset_trans/libopenaptx/validation_workload/purebin/bin/libopenaptx_stage_a"
[builds.codex]
binary_path = "dataset_trans/libopenaptx/validation_workload/purebin/bin/libopenaptx_codex"
[builds.freeform]
binary_path = "dataset_trans/libopenaptx/validation_workload/purebin/bin/libopenaptx_freeform"
[builds.full]                                  # full arm = 3_perf_opt (rule-guided)
binary_path = "dataset_trans/libopenaptx/validation_workload/purebin/bin/libopenaptx_full"

[measure]
warmup_runs  = 5
measure_runs = 30
required_cv  = 0.03
max_load     = 1.0                                               
cv_retries   = 2                            
pin_cpu      = 16
order        = ["c", "raw", "codex", "stage_a", "freeform", "full"]

[gates]
equivalence = "stdout_sha256"

                                                                            
[[operations]]
name = "encode"
args = ["encode", "$INPUT", "$ITERS"]
  [[operations.inputs]]
  name = "testsignal.pcm"
  path = "dataset_trans/libopenaptx/validation_workload/inputs/testsignal.pcm"
  iters = 8
  stdout_sha256 = "6267c341f39be92ec997018e48e18f95a6a861603e81f8b637c12e56fbc96638"

[[operations]]
name = "encode_hd"
