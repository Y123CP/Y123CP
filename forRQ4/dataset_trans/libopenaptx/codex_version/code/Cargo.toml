[workspace]
members = [
]
[package]
name = "libopenaptx_raw"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "libopenaptx_raw"
path = "lib.rs"
crate-type = ["rlib"]
[dependencies]

[[bin]]
path = "src/openaptxdec.rs"
name = "openaptxdec"

[[bin]]
path = "src/openaptxenc.rs"
name = "openaptxenc"

# perf_opt fair-build profile — auto-injected by bench_pipeline.py.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = false
