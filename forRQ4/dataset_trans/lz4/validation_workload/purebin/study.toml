# ============================================================================
                                                    
#
                                     
#   c / raw(0_raw) / cleaned(1_cleaned) / stage_a(2_stage_a)
                                                        
                                                                      
                                                    
#
                                           
#   bash perf_run.sh script_c2rust/.venv/bin/python \
#       dataset_trans/run_validation.py \
#       dataset_trans/lz4/validation_workload/purebin/study.toml --wait-quiet
# ============================================================================

[study]
project     = "lz4"
compare     = ["c", "raw", "codex", "stage_a", "freeform", "full"]
report_mode = "per_input"

[builds.c]
binary_path = "dataset_trans/lz4/validation_workload/purebin/bin/lz4_c"
[builds.raw]
binary_path = "dataset_trans/lz4/validation_workload/purebin/bin/lz4_raw"
[builds.stage_a]                                 # E1 + intra_ptr(struct&mut)+ deunsafe
binary_path = "dataset_trans/lz4/validation_workload/purebin/bin/lz4_stage_a"

[builds.codex]
binary_path = "dataset_trans/lz4/validation_workload/purebin/bin/lz4_codex"
[builds.freeform]
binary_path = "dataset_trans/lz4/validation_workload/purebin/bin/lz4_freeform"
[builds.full]                                  # full arm = 3_perf_opt (rule-guided)
binary_path = "dataset_trans/lz4/validation_workload/purebin/bin/lz4_full"

[measure]
warmup_runs  = 5
measure_runs = 30
required_cv  = 0.03
max_load     = 1.0                                               
cv_retries   = 2                            
pin_cpu      = 16
order        = ["c", "raw", "codex", "stage_a", "freeform", "full"]

[gates]
equivalence = "stdout_sha256"

                                                                            
[[operations]]
name = "compress_fast"
args = ["compress_fast", "$INPUT", "$ITERS"]
status = "ready"
