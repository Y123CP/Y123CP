# Generated by script_c2rust/harness_gen — workload harness for lz4_raw.
# Contract: `harness gen-seeds <dir>` / `harness <op> <input> [iters]`;
# stdout carries only deterministic digest lines (W1-style oracle bytes).

[package]
name = "lz4_harness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "lz4_harness"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
lz4_raw = { path = "../../../0_raw" }

# Fair-build profile for later perf use (gates build the dev profile).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
