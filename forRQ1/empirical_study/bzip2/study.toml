# -----------------------------------------------------------------------------
# Correctness gate (equivalence only — NOT timed, NOT in the sweeps above).
# Both builds must pass these before any perf number is trusted; also counted
# in the coverage union.
# -----------------------------------------------------------------------------
[oracle]
exit_code = 0
correctness_manifests = []   # those were PIPELINE W1 gates (dataset_trans_process/.../workloads,
                             # "invoked after every fn lift inside stage 2-6") — not empirical-study
                             # assets and not read by run_study.py; equivalence is gated per-input
                             # via stdout_sha256 above. Consistent with the other 7 projects.

# -----------------------------------------------------------------------------
# Workload-validity gates — checked BEFORE trusting RQ1/RQ2 numbers.
# (code coverage != perf representativeness.)
# -----------------------------------------------------------------------------
[gates]
coverage_line_min = 60   # gcov line %, RE-MEASURED on exactly the inputs above
coverage_fn_min   = 70   # gcov function %
self_time_own_min = 70   # % of profiled self-time in bzip2's OWN fns (not libc/std)
