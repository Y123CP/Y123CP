# =============================================================================
# OPERATION 2 — DECOMPRESS.  args = -c -d <bz2>  (stdout hashed).
# Exercises the OTHER half of bzip2 (huffman-decode / inverse-BWT) so the study
# covers the whole project, not just compress.
# STATUS: inputs TO BE GENERATED — only a 79-byte tiny.bz2 exists today. The
# driver (or a gen step) must produce silesia-*.bz2 by compressing each raw with
# the C reference `bzip2 -9`, storing under empirical_study/bzip2/inputs/decompress/.
# DECOMPRESS ORACLE: decompressing X.bz2 must reproduce the original raw X, whose
# sha256 is the input_sha256 from inputs/experiment/EXPECTED_HASHES.txt (below).
# =============================================================================
[[operations]]
name   = "decompress"
args   = ["-c", "-d", "$INPUT"]
status = "ready"     # silesia-*.bz2 generated 2026-07-01 (C-ref bzip2 -9), oracle verified

  [[operations.inputs]]
  name = "silesia-xml"
  path = "empirical_study/bzip2/inputs/decompress/silesia-xml.bz2"
  stdout_sha256 = "0e82e54e695c1938e4193448022543845b33020c8be6bf3bf3ead2224903e08c"  # = raw xml sha256

  [[operations.inputs]]
  name = "silesia-dickens"
  path = "empirical_study/bzip2/inputs/decompress/silesia-dickens.bz2"
  stdout_sha256 = "b24c37886142e11d0ee687db6ab06f936207aa7f2ea1fd1d9a36763c7a507e6a"

  [[operations.inputs]]
  name = "silesia-samba"
  path = "empirical_study/bzip2/inputs/decompress/silesia-samba.bz2"
  stdout_sha256 = "93ba07bc44d8267789c1d911992f40b089ffa2140b4a160fac11ccae9a40e7b2"

  [[operations.inputs]]
  name = "silesia-mozilla"
  path = "empirical_study/bzip2/inputs/decompress/silesia-mozilla.bz2"
