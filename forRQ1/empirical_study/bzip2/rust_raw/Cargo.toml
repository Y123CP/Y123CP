[workspace]
members = [
]
[package]
name = "bzip2_1_0_8_raw"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "bzip2_1_0_8_raw"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]
[dependencies]

[[bin]]
path = "src/bzip2.rs"
name = "bzip2"

[[bin]]
path = "src/bzip2recover.rs"
name = "bzip2recover"

# perf_opt fair-build profile — see script_c2rust/docs/perf_tree_design.md §2.8.
# Pairs with .cargo/config.toml (target-cpu=native).
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = false
