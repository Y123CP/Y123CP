[package]
name = "ogg_encode"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ogg_encode"
path = "src/main.rs"

[dependencies]
# c2rust_raw = libogg 0_raw (package libogg_raw). Empirical study links 0_raw.
libogg_raw = { path = "../rust_raw" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = false
