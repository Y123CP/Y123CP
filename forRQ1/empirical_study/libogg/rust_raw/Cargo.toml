[package]
name = "libogg_raw"
authors = ["C2Rust"]
version = "0.0.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "libogg_raw"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]

# Empirical-study fair-build profile (matches the other 0_raw crates + the
# C-side clang-17 -O3 -flto -march=native). target-cpu=native comes from the
# driving harness crate's .cargo/config.toml.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = false
